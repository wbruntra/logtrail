---
# Deploy logtrail: ansible-playbook ansible/deploy.yml -e deployment=production
# Deploys origin/<target_branch> from GitHub, so push first.
- name: Deploy logtrail
  hosts: '{{ deployment | mandatory("Pass -e deployment=<profile>, e.g. -e deployment=production") }}'
  vars:
    node_bin_dir: '/home/{{ ansible_user }}/.nvm/versions/node/{{ pm2_node_version }}/bin'
    secrets_bundle: '{{ playbook_dir }}/files/{{ deployment }}'
    # Gitignored runtime files pushed from ansible/files/<profile>/ when present.
    bundled_files: [secrets.js, logtrail.config.yaml]

  tasks:
    - name: 1. Update repository
      git:
        repo: 'git@github.com:wbruntra/logtrail.git'
        dest: '{{ project_root }}'
        version: '{{ branch | default(target_branch) }}'
        force: yes
      register: git_result
      tags: [git]

    - name: 2. Copy secrets.js and logtrail.config.yaml from the local bundle, if present
      # The server's copies are the source of truth until the files exist
      # locally under ansible/files/<profile>/.
      copy:
        src: '{{ secrets_bundle }}/{{ item }}'
        dest: '{{ project_root }}/{{ item }}'
        mode: '0600'
      loop: '{{ bundled_files }}'
      when: lookup('ansible.builtin.fileglob', secrets_bundle ~ '/' ~ item) | length > 0
      tags: [secrets]

    - name: 3. Install dependencies
      command: bun install --frozen-lockfile
      args:
        chdir: '{{ project_root }}'
      tags: [deps]

    - name: 4. Build frontend
      shell: bun install --frozen-lockfile && bun run build
      args:
        chdir: '{{ project_root }}/client'
      tags: [build, frontend]

    - name: 5. Restart the app (pm2)
      environment:
        # pm2 lives under nvm, which a non-interactive shell doesn't put on PATH.
        PATH: '{{ node_bin_dir }}:{{ ansible_env.PATH }}'
      block:
        - name: Recreate the pm2 process if its entry script changed
          # pm2 restart keeps a process's original script path, so a changed
          # entry file needs a delete and start.
          shell: |
            set -e
            want="{{ project_root }}/$(bun -e "console.log(require('./ecosystem.config.cjs').apps[0].script)")"
            [ -f ecosystem.config.cjs ] || { echo 'ecosystem.config.cjs missing' >&2; exit 1; }
            have=$(pm2 jlist | bun -e "const l = await Bun.stdin.json(); console.log(l.find((a) => a.name === '{{ pm2_name }}')?.pm2_env.pm_exec_path ?? '')")
            if [ -n "$have" ] && [ "$have" != "$want" ]; then
              pm2 delete {{ pm2_name }} && echo "recreated: $have -> $want"
            fi
          args:
            chdir: '{{ project_root }}'
          register: pm2_recreate
          changed_when: "'recreated' in pm2_recreate.stdout"

        - name: Start or restart from ecosystem.config.cjs
          command: pm2 startOrRestart ecosystem.config.cjs --update-env
          args:
            chdir: '{{ project_root }}'

        - name: Persist the pm2 process list
          command: pm2 save
      tags: [pm2, restart]

    - name: 6. Verify the app answers on its port
      uri:
        url: 'http://127.0.0.1:{{ app_port }}/api/health'
        timeout: 10
      register: local_check
      failed_when: (local_check.json.status | default('') | lower) != 'ok'
      retries: 6
      delay: 5
      until: local_check is succeeded
      changed_when: false
      tags: [verify]

    - name: 7. Verify the public site through nginx
      # Runs from the machine running Ansible, so it also catches DNS, TLS
      # and nginx problems.
      delegate_to: localhost
      block:
        - name: Frontend loads
          uri:
            url: '{{ public_url }}/'
            return_content: yes
          register: public_page
          failed_when: '''<div id="root">'' not in public_page.content'
          changed_when: false

        - name: API answers
          uri:
            url: '{{ public_url }}/api/health'
          register: public_api
          retries: 3
          delay: 5
          until: public_api is succeeded
          changed_when: false
      tags: [verify]

    - name: Deployed
      debug:
        msg: '{{ deployment }} is at {{ git_result.after[:7] }} (was {{ git_result.before[:7] if git_result.before else "none" }})'
      tags: [git]
